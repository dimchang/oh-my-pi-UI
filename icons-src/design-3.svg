<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- design-3 反白镂空 π：渐变磁贴为底，π 镂空近黑 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="1024" height="1024" rx="180"/>
    </clipPath>
  </defs>

  <!-- 渐变圆角磁贴 -->
  <rect width="1024" height="1024" rx="180" fill="url(#g)"/>

  <!-- 极淡高光斜切 -->
  <g clip-path="url(#tile)">
    <polygon points="1024,0 1024,480 480,1024 0,1024 0,0" fill="#ffffff" opacity="0.09"/>
  </g>

  <!-- 镂空 π（近黑，粗壮几何：横梁 + 双竖腿） -->
  <g fill="#0a0a0f">
    <rect x="192" y="232" width="640" height="140" rx="70"/>
    <rect x="264" y="232" width="134" height="560" rx="67"/>
    <rect x="626" y="232" width="134" height="560" rx="67"/>
  </g>
</svg>
